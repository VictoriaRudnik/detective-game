services:
  - type: web
    name: live-suspects-server
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@12.6.0 install --frozen-lockfile
    startCommand: cd apps/server && node_modules/.bin/tsx src/index.ts
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGIN
        sync: false # your Vercel URL, e.g. https://live-suspects.vercel.app
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
